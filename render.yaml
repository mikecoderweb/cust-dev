services:
  - type: worker
    name: qiziqish-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
  - type: web
    name: qiziqish-sayt
    runtime: static
    buildCommand: echo "build shart emas"
    staticPublishPath: ./site
